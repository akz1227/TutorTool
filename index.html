<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometry Sketchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFDF9;--panel:#FFFDF9;--paper:#FFFDF9;--stage:#F5EDE9;--grid:#E8D9D7;
  --accent:#611224;--accent-fg:#FFFDF9;--fg:#2B2526;--muted:#78666A;
  --line:#E4D3D3;--hover:#F6E5E5;--soft:#F3E5E5;--blush:#FBC5C5;
  --ink-red:#D4302B;--ink-blue:#1F5FD1;--ink-black:#2B2526;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body)}
body{padding:12px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--blush);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font:700 23px/1 var(--f-display);color:var(--accent);margin:0 12px 0 0;letter-spacing:-.02em}
.top .pages{margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blush);border-color:var(--blush);color:var(--fg);font-weight:600}
.btn.primary:hover{background:#F6AEAF;border-color:#F6AEAF}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.grp>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:6px 10px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.red{background:var(--ink-red)}.sw.blue{background:var(--ink-blue)}.sw.black{background:var(--ink-black)}
.tool{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;width:100%;padding:7px 10px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:13.5px;font-weight:500;line-height:1.1;text-align:left}
.tool.sep{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 8px 8px;padding-top:11px}
.tool svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px;align-items:start}
.stagewrap{min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto}
.stage.zoomed{max-height:calc(100vh - 120px)}
#cv{display:block;width:100%;margin:0 auto;height:auto;background:var(--paper);touch-action:none;box-shadow:0 2px 10px rgba(50,20,30,.14);cursor:crosshair;border-radius:2px}
.pages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pages .plab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.pages .pg{min-width:36px;justify-content:center;padding:5px 10px}
.hint{display:flex;gap:5px;align-items:center;min-height:22px;color:var(--muted);font-size:13px}
.hint b{color:var(--accent);font-weight:700}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;flex:1 1 auto;min-height:0;overflow:hidden}
.left{position:sticky;top:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 78px);min-width:0}
.paperbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:600;flex:none}
#paperDlg{width:330px}
.zr{flex-wrap:nowrap}.zr input[type=range]{flex:1;min-width:60px;width:auto}.zr .btn{padding:6px 10px}
.sv{display:flex;flex-direction:column;min-height:0;flex:1}
#tools{display:flex;flex-direction:column;gap:3px;padding:8px;overflow:auto}
.h2r{display:flex;align-items:center;gap:10px}
.xbtn{width:28px;height:28px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:19px;line-height:1;display:grid;place-items:center;padding:0;color:var(--fg)}
.xbtn:hover{background:var(--hover)}
.stagebox{position:relative;min-width:0}
.oxydlg,.pendlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(50,20,30,.2)}
.oxydlg{position:absolute;top:21px;right:21px;z-index:5;padding:6px;max-width:calc(100% - 42px)}
.oxydlg{display:flex;flex-direction:column;align-items:stretch}
.oxydlg #oxyToggle{align-self:flex-end;font-weight:600;color:var(--accent)}
.oxybody{display:flex;flex-direction:column;gap:12px;padding:10px 6px 6px}
.pendlg{position:fixed;z-index:30;width:230px;padding:12px;display:flex;flex-direction:column;gap:12px}
.pendlg input[type=range]{width:100%}
.pendlg .tv{display:flex;align-items:center;gap:8px}
#penPrev{display:block;width:100%;border-radius:99px;min-height:1px;background:var(--ink-black)}
.prevbox{height:30px;display:flex;align-items:center;border:1px dashed var(--line);border-radius:7px;padding:0 10px}
.lim{font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:68px}
.side h2{font:700 15px/1 var(--f-display);color:var(--accent);margin:0;padding:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.side h2 label{font:400 12px var(--f-body);color:var(--muted);display:flex;gap:5px;align-items:center}
#list{list-style:none;margin:0;padding:6px;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:90px}
#list li{display:grid;grid-template-columns:28px 28px minmax(0,1fr) auto 28px;align-items:center;gap:5px;padding:2px 4px;border-radius:6px}
#list li:hover{background:var(--hover)}
#list li.off input.nm{opacity:.45;text-decoration:line-through}
#list .ic{width:28px;height:28px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
#list .ic:hover{background:var(--line);color:var(--fg)}
#list .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dot{width:10px;height:10px;border-radius:50%}
input.nm{font:500 13px var(--f-mono);width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 5px}
input.nm:hover{border-color:var(--line)}
input.nm:focus{border-color:var(--blush);background:var(--panel)}
.kind{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.empty{color:var(--muted);padding:14px 10px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);padding:9px 14px;border:1px solid var(--blush);border-radius:8px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20;max-width:90vw}
input[type=range]{accent-color:var(--accent);cursor:pointer}
[hidden]{display:none!important}
.fld{display:flex;align-items:center;gap:5px;font:500 12px var(--f-mono);color:var(--muted)}
.fld input{width:72px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--panel);font:500 13px var(--f-mono);color:var(--fg)}
#thicknessValue,#zoomValue{min-width:46px;color:var(--accent);font:500 12px var(--f-mono)}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.left{position:static;max-height:none}.side{flex:none}.stage{padding:6px}#tools{flex-direction:row;flex-wrap:wrap}.tool{width:auto}.tool.sep{margin-top:0;border-top:1px solid transparent;padding-top:7px;border-radius:8px}}
@media(max-width:480px){.tool span{font-size:12px}.top h1{width:100%;margin-bottom:5px}.stage{padding:4px}}
@media print{body{padding:0;background:#fff}.top,.left,.pages,.oxydlg,.pendlg,.hint,.side,.toast{display:none!important}.main{display:block}.stage{padding:0;border:0;background:#fff}#cv{box-shadow:none;width:100%!important}.stage{overflow:visible;max-height:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Geometry Sketchpad</h1>
    <div class="pages" id="pages"></div>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="btn" id="clear">Clear all</button>
    <button class="btn primary" id="pdf">Export PDF</button>
  </div>
  <div class="main">
    <div class="left" id="left">
      <button class="tool paperbtn" id="paperBtn" aria-pressed="false" aria-haspopup="dialog" title="Paper settings"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg><span>Paper</span></button>
    <aside class="side" id="side">
      <div class="sv" id="toolsView">
        <h2>Tools</h2>
        <div id="tools"></div>
      </div>
      <div class="sv" id="objView" hidden>
        <h2><span>Objects</span><span class="h2r"><label><input type="checkbox" id="lbl" checked> Labels</label><button class="xbtn" id="objClose" aria-label="Back to tools" title="Back to tools">&times;</button></span></h2>
        <ul id="list"></ul>
      </div>
    </aside>
    </div>
    <div class="stagewrap">
      <div class="stagebox">
        <div class="stage"><canvas id="cv" width="2400" height="1697" aria-label="Drawing paper"></canvas></div>
        <div class="oxydlg" id="oxyDlg" role="group" aria-label="Oxy settings" hidden>
          <button class="btn" id="oxyToggle" aria-expanded="true" aria-controls="oxyBody" title="Show or hide the Oxy settings">Oxy settings &#9662;</button>
          <div class="oxybody" id="oxyBody">
            <div class="grp"><span>Place point (x, y)</span><div class="row">
              <label class="fld">x <input id="px" type="number" step="any" value="0" aria-label="x coordinate"></label>
              <label class="fld">y <input id="py" type="number" step="any" value="0" aria-label="y coordinate"></label>
              <button class="btn" id="addxy">Add point</button>
            </div></div>
            <div class="grp"><span>Axis range</span>
              <div class="row"><b class="lim" title="Largest value shown on each axis">Maximum</b>
                <label class="fld">x <input id="mxx" type="number" step="any" min="0" value="30" aria-label="Maximum of x"></label>
                <label class="fld">y <input id="mxy" type="number" step="any" min="0" value="21" aria-label="Maximum of y"></label></div>
              <div class="row"><b class="lim" title="Value of one grid square">Minimum</b>
                <label class="fld">x <input id="ux" type="number" step="any" min="0" value="1" aria-label="Minimum of x"></label>
                <label class="fld">y <input id="uy" type="number" step="any" min="0" value="1" aria-label="Minimum of y"></label></div>
            </div>
          </div>
        </div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  
  </div>
</div>
<div class="pendlg" id="paperDlg" role="dialog" aria-label="Paper settings" hidden>
  <div class="grp"><span>Paper</span><div class="seg" id="paper">
    <button data-v="blank" aria-pressed="true">Blank</button><button data-v="dot" aria-pressed="false">Dot</button><button data-v="line" aria-pressed="false">Line</button><button data-v="box" aria-pressed="false">Box</button><button data-v="oxy" aria-pressed="false">Oxy</button>
  </div></div>
  <div class="grp"><span>Scale paper</span><div class="row zr">
    <button class="btn" id="zoomOut" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
    <input id="zoom" type="range" min="25" max="300" step="5" value="100" aria-label="Paper scale">
    <button class="btn" id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <output id="zoomValue">100%</output>
    <button class="btn" id="zoomReset" title="Fit the whole page on screen (0)">Fit</button>
  </div></div>
</div>
<div class="pendlg" id="penDlg" role="dialog" aria-label="Pen settings" hidden>
  <div class="grp"><span>Ink</span><div class="row" id="inks">
    <button class="sw red" data-v="red" aria-label="Red" aria-pressed="false"></button>
    <button class="sw blue" data-v="blue" aria-label="Blue" aria-pressed="false"></button>
    <button class="sw black" data-v="black" aria-label="Charcoal" aria-pressed="true"></button>
  </div></div>
  <div class="grp"><span>Thickness</span><div class="tv">
    <input id="thickness" type="range" min="1" max="12" step="0.5" value="3.2" aria-label="Pen thickness">
    <output id="thicknessValue">3.2 px</output>
  </div></div>
  <div class="prevbox"><i id="penPrev" style="height:3.2px"></i></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const W=2400,H=1697,GRID=40;
const INK={red:'#D4302B',blue:'#1F5FD1',black:'#2B2526'};
const PAPER='#FFFDF9';
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const newPage=paper=>({paper:paper||'blank',objs:[],strokes:[],n:{p:0,l:0,s:0,c:0},id:1,ax:{sx:1,sy:1,maxx:30,maxy:21}});
let DOC={labels:true,cur:0,pages:[newPage()]},S=DOC.pages[0];
let ink='black',tool='pen',pend=[],hover=null,cur=null,penWidth=3.2,penOpen=false,paperOpen=false;
let ruler={on:false,x:W/2,y:H/2,a:0};
let GC=new Map(),M=new Map();
const KIND={xy:'Point (x, y)',on:'Point on object',free:'Point',mid:'Midpoint',int:'Intersection',line:'Line',perp:'Perpendicular',para:'Parallel',pbis:'Perp. bisector',abis:'Angle bisector',seg:'Segment',circ:'Circle'};
const isPt=o=>o.k==='free'||o.k==='mid'||o.k==='int'||o.k==='on'||o.k==='xy';
/* Oxy coordinate plane: origin at (OX,OY); one grid square = unit sx (x) and sy (y). */
const OX=W/2,OY=H/2;
/* ax(): per page. sx/sy = Minimum (value of one grid square); maxx/maxy = Maximum (largest value on each axis). */
const ax=()=>{const a=S.ax||(S.ax={});if(!(a.sx>0))a.sx=1;if(!(a.sy>0))a.sy=1;if(!(a.maxx>0))a.maxx=30;if(!(a.maxy>0))a.maxy=21;if(a.maxx<a.sx)a.maxx=a.sx;if(a.maxy<a.sy)a.maxy=a.sy;if(a.maxx/a.sx>120)a.maxx=a.sx*120;if(a.maxy/a.sy>120)a.maxy=a.sy*120;return a};
const sc=()=>{const a=ax();return {x:OX/a.maxx,y:OY/a.maxy}};
const toPx=(x,y)=>{const k=sc();return {x:OX+x*k.x,y:OY-y*k.y}};
const toMath=(x,y)=>{const k=sc();return {x:(x-OX)/k.x,y:(OY-y)/k.y}};
const fmt=v=>String(+(+v).toFixed(3));
function nameFor(k){const n=S.n;if(k==='free'||k==='mid'||k==='int'||k==='on'||k==='xy'){const i=n.p++;return String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'')}if(k==='seg')return 's'+(++n.s);if(k==='circ')return 'c'+(++n.c);return 'l'+(++n.l)}
function add(k,refs,extra){const o=Object.assign({id:S.id++,k,refs:refs||[],name:nameFor(k),vis:true,c:ink},extra||{});S.objs.push(o);return o}
const mkLine=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);return L<1e-9?null:{t:'l',x:a.x,y:a.y,dx:dx/L,dy:dy/L}};
function calc(o,R){
 switch(o.k){
  case 'free':return {t:'p',x:o.x,y:o.y};
  case 'xy':{const q=toPx(o.mx,o.my);return {t:'p',x:q.x,y:q.y}}
  case 'on':{const g=R[0];
   if(g.t==='c')return {t:'p',x:g.x+g.r*Math.cos(o.a),y:g.y+g.r*Math.sin(o.a)};
   if(g.t==='s'){const s=Math.max(0,Math.min(1,o.s));return {t:'p',x:g.x1+(g.x2-g.x1)*s,y:g.y1+(g.y2-g.y1)*s}}
   return {t:'p',x:g.x+g.dx*o.s,y:g.y+g.dy*o.s}}
  case 'mid':return {t:'p',x:(R[0].x+R[1].x)/2,y:(R[0].y+R[1].y)/2};
  case 'line':return mkLine(R[0],R[1]);
  case 'seg':{const l=mkLine(R[0],R[1]);return l&&{...l,t:'s',x1:R[0].x,y1:R[0].y,x2:R[1].x,y2:R[1].y}}
  case 'perp':return R[1].t==='c'?null:{t:'l',x:R[0].x,y:R[0].y,dx:-R[1].dy,dy:R[1].dx};
  case 'para':return R[1].t==='c'?null:{t:'l',x:R[0].x,y:R[0].y,dx:R[1].dx,dy:R[1].dy};
  case 'pbis':{const l=mkLine(R[0],R[1]);return l&&{t:'l',x:(R[0].x+R[1].x)/2,y:(R[0].y+R[1].y)/2,dx:-l.dy,dy:l.dx}}
  case 'abis': {
   // Accept both infinite lines and finite segments.
   const asLine = g => {
    if (!g || (g.t !== 'l' && g.t !== 's')) return null;
    return {
     x: g.x,
     y: g.y,
     dx: g.dx,
     dy: g.dy
    };
   };

   const l1 = asLine(R[0]);
   const v = R[1];
   const l2 = asLine(R[2]);

   if (!l1 || !v || v.t !== 'p' || !l2) return null;

   // Confirm that the vertex lies on both lines.
   const eps = 12;
   const d1 = Math.abs(
    (v.x - l1.x) * l1.dy -
    (v.y - l1.y) * l1.dx
   );
   const d2 = Math.abs(
    (v.x - l2.x) * l2.dy -
    (v.y - l2.y) * l2.dx
   );

   if (d1 > eps || d2 > eps) return null;

   let ax = l1.dx;
   let ay = l1.dy;
   let bx = l2.dx;
   let by = l2.dy;

   // Align directions to construct the internal angle bisector.
   if (ax * bx + ay * by < 0) {
    bx = -bx;
    by = -by;
   }

   const dx = ax + bx;
   const dy = ay + by;
   const len = Math.hypot(dx, dy);

   // Avoid an undefined bisector for parallel directions.
   if (len < 1e-6) return null;

   return {
    t: 'l',
    x: v.x,
    y: v.y,
    dx: dx / len,
    dy: dy / len
   };
  }
  case 'circ':return {t:'c',x:R[0].x,y:R[0].y,r:Math.hypot(R[1].x-R[0].x,R[1].y-R[0].y)};
  case 'int':{const c=inter(R[0],R[1]);return c[o.n]?{t:'p',...c[o.n]}:null}
 }
 return null;
}
function geo(id){if(GC.has(id))return GC.get(id);const o=M.get(id);let g=null;if(o){GC.set(id,null);const R=o.refs.map(geo);if(R.every(Boolean))g=calc(o,R)}GC.set(id,g);return g}
function inter(a,b){
 if(!a||!b)return [];
 if(a.t==='c'&&b.t!=='c')[a,b]=[b,a];
 if(a.t==='c'&&b.t==='c'){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d<1e-9||d>a.r+b.r||d<Math.abs(a.r-b.r))return [];
  const l=(a.r*a.r-b.r*b.r+d*d)/(2*d),h=Math.sqrt(Math.max(0,a.r*a.r-l*l)),ux=dx/d,uy=dy/d,mx=a.x+ux*l,my=a.y+uy*l;
  return [{x:mx-uy*h,y:my+ux*h},{x:mx+uy*h,y:my-ux*h}];
 }
 if(b.t==='c'){
  const fx=a.x-b.x,fy=a.y-b.y,B=fx*a.dx+fy*a.dy,C=fx*fx+fy*fy-b.r*b.r,disc=B*B-C;
  if(disc<0)return [];const s=Math.sqrt(disc);

/* Palm rejection: the canvas ignores finger/palm (touch) input completely.
   Pen and mouse are accepted. While one pointer is drawing, every other
   pointer (e.g. a palm resting next to the pen) is ignored. */
let activePointer=null;
const rejected=e=>e.pointerType==='touch';
/* Block touch-driven scrolling/zooming/long-press on the canvas too. */
['touchstart','touchmove','touchend','touchcancel'].forEach(t=>cv.addEventListener(t,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
cv.addEventListener('contextmenu',e=>e.preventDefault());

cv.addEventListener('pointerdown',e=>{
 if(rejected(e))return;
 if(e.button>0)return;
 if(activePointer!==null)return;
 e.preventDefault();
 activePointer=e.pointerId;
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 cur=pos(e);drag=null;
 const rh=hitRuler(cur);
 if(rh)drag=rulerDrag(rh.t,cur);else TOOLS[tool].down(cur);
 afterAction();
});
cv.addEventListener('pointermove',e=>{
 if(rejected(e))return;
 if(activePointer!==null&&e.pointerId!==activePointer)return;
 cur=pos(e);
 if(drag){const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];if(evs.length>1)for(const ev of evs)drag.move(pos(ev));else drag.move(cur);scheduleDraw();return}
 if(tool!=='pen'){const h=hitPoint(cur)||hitLine(cur,true);hover=h?h.id:null}
 scheduleDraw();
});
function endDrag(e){
 if(rejected(e))return;
 if(activePointer!==null&&e.pointerId!==activePointer)return;
 activePointer=null;
 if(!drag)return;
 const d=drag;drag=null;d.up();afterAction();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',e=>{if(rejected(e))return;if(!drag){cur=null;hover=null;draw()}});
