<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometry Sketchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFDF9;--panel:#FFFDF9;--paper:#FFFDF9;--stage:#F5EDE9;--grid:#E8D9D7;
  --accent:#611224;--accent-fg:#FFFDF9;--fg:#2B2526;--muted:#78666A;
  --line:#E4D3D3;--hover:#F6E5E5;--soft:#F3E5E5;--blush:#FBC5C5;
  --ink-red:#D4302B;--ink-blue:#1F5FD1;--ink-black:#2B2526;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body)}
body{padding:12px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--blush);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font:700 23px/1 var(--f-display);color:var(--accent);margin:0 auto 0 0;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blush);border-color:var(--blush);color:var(--fg);font-weight:600}
.btn.primary:hover{background:#F6AEAF;border-color:#F6AEAF}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.grp>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:6px 10px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.red{background:var(--ink-red)}.sw.blue{background:var(--ink-blue)}.sw.black{background:var(--ink-black)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:68px;padding:6px 5px;border:1px solid var(--line);background:transparent;border-radius:8px;font-size:11.5px;line-height:1.15;text-align:center}
.tool svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px;align-items:start}
.stagewrap{min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:hidden}
#cv{display:block;width:100%;height:auto;background:var(--paper);touch-action:none;box-shadow:0 2px 10px rgba(50,20,30,.14);cursor:crosshair;border-radius:2px}
.pages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pages .plab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.pages .pg{min-width:36px;justify-content:center;padding:5px 10px}
.hint{display:flex;gap:5px;align-items:center;min-height:22px;color:var(--muted);font-size:13px}
.hint b{color:var(--accent);font-weight:700}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 40px);position:sticky;top:8px}
.side h2{font:700 15px/1 var(--f-display);color:var(--accent);margin:0;padding:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.side h2 label{font:400 12px var(--f-body);color:var(--muted);display:flex;gap:5px;align-items:center}
#list{list-style:none;margin:0;padding:6px;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:90px}
#list li{display:grid;grid-template-columns:28px 28px minmax(0,1fr) auto 28px;align-items:center;gap:5px;padding:2px 4px;border-radius:6px}
#list li:hover{background:var(--hover)}
#list li.off input.nm{opacity:.45;text-decoration:line-through}
#list .ic{width:28px;height:28px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
#list .ic:hover{background:var(--line);color:var(--fg)}
#list .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dot{width:10px;height:10px;border-radius:50%}
input.nm{font:500 13px var(--f-mono);width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 5px}
input.nm:hover{border-color:var(--line)}
input.nm:focus{border-color:var(--blush);background:var(--panel)}
.kind{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.empty{color:var(--muted);padding:14px 10px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);padding:9px 14px;border:1px solid var(--blush);border-radius:8px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20;max-width:90vw}
input[type=range]{accent-color:var(--accent);cursor:pointer}
#thicknessValue{min-width:46px;color:var(--accent);font:500 12px var(--f-mono)}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.stage{padding:6px}.tool{width:calc((100% - 20px)/6)}.bar .grp.tools{width:100%}}
@media(max-width:480px){.tool{width:calc((100% - 8px)/3)}.top h1{width:100%;margin-bottom:5px}.stage{padding:4px}}
@media print{body{padding:0;background:#fff}.top,.bar,.pages,.hint,.side,.toast{display:none!important}.main{display:block}.stage{padding:0;border:0;background:#fff}#cv{box-shadow:none;width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Geometry Sketchpad</h1>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="btn" id="clear">Clear all</button>
    <button class="btn primary" id="pdf">Export PDF</button>
  </div>
  <div class="bar">
    <div class="grp"><span>Paper</span><div class="seg" id="paper">
      <button data-v="blank" aria-pressed="true">Blank</button><button data-v="dot" aria-pressed="false">Dot</button><button data-v="line" aria-pressed="false">Line</button><button data-v="box" aria-pressed="false">Box</button>
    </div></div>
    <div class="grp"><span>Ink</span><div class="row" id="inks">
      <button class="sw red" data-v="red" aria-label="Red" aria-pressed="false"></button>
      <button class="sw blue" data-v="blue" aria-label="Blue" aria-pressed="false"></button>
      <button class="sw black" data-v="black" aria-label="Charcoal" aria-pressed="true"></button>
    </div></div>
    <div class="grp"><span>Pen thickness</span><div class="row">
      <input id="thickness" type="range" min="1" max="12" step="0.5" value="3.2" aria-label="Pen thickness" style="width:120px">
      <output id="thicknessValue">3.2 px</output>
    </div></div>
    <div class="grp tools"><span>Tools</span><div class="row" id="tools"></div></div>
  </div>
  <div class="main">
    <div class="stagewrap">
      <div class="pages" id="pages"></div>
      <div class="stage"><canvas id="cv" width="1600" height="1131" aria-label="Drawing paper"></canvas></div>
      <div class="hint" id="hint"></div>
    </div>
    <aside class="side">
      <h2>Objects <label><input type="checkbox" id="lbl" checked> Labels</label></h2>
      <ul id="list"></ul>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const W=1600,H=1131,GRID=40;
const INK={red:'#D4302B',blue:'#1F5FD1',black:'#2B2526'};
const PAPER='#FFFDF9';
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const newPage=paper=>({paper:paper||'blank',objs:[],strokes:[],n:{p:0,l:0,s:0,c:0},id:1});
let DOC={labels:true,cur:0,pages:[newPage()]},S=DOC.pages[0];
let ink='black',tool='pen',pend=[],hover=null,cur=null,penWidth=3.2;
let GC=new Map(),M=new Map();
const KIND={free:'Point',mid:'Midpoint',int:'Intersection',line:'Line',perp:'Perpendicular',para:'Parallel',pbis:'Perp. bisector',abis:'Angle bisector',seg:'Segment',circ:'Circle'};
const isPt=o=>o.k==='free'||o.k==='mid'||o.k==='int';
function nameFor(k){const n=S.n;if(k==='free'||k==='mid'||k==='int'){const i=n.p++;return String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'')}if(k==='seg')return 's'+(++n.s);if(k==='circ')return 'c'+(++n.c);return 'l'+(++n.l)}
function add(k,refs,extra){const o=Object.assign({id:S.id++,k,refs:refs||[],name:nameFor(k),vis:true,c:ink},extra||{});S.objs.push(o);return o}
const mkLine=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);return L<1e-9?null:{t:'l',x:a.x,y:a.y,dx:dx/L,dy:dy/L}};
function calc(o,R){
 switch(o.k){
  case 'free':return {t:'p',x:o.x,y:o.y};
  case 'mid':return {t:'p',x:(R[0].x+R[1].x)/2,y:(R[0].y+R[1].y)/2};
  case 'line':return mkLine(R[0],R[1]);
  case 'seg':{const l=mkLine(R[0],R[1]);return l&&{...l,t:'s',x1:R[0].x,y1:R[0].y,x2:R[1].x,y2:R[1].y}}
  case 'perp':return R[1].t==='c'?null:{t:'l',x:R[0].x,y:R[0].y,dx:-R[1].dy,dy:R[1].dx};
  case 'para':return R[1].t==='c'?null:{t:'l',x:R[0].x,y:R[0].y,dx:R[1].dx,dy:R[1].dy};
  case 'pbis':{const l=mkLine(R[0],R[1]);return l&&{t:'l',x:(R[0].x+R[1].x)/2,y:(R[0].y+R[1].y)/2,dx:-l.dy,dy:l.dx}}
  case 'abis': {
   // Accept both infinite lines and finite segments.
   const asLine = g => {
    if (!g || (g.t !== 'l' && g.t !== 's')) return null;
    return {
     x: g.x,
     y: g.y,
     dx: g.dx,
     dy: g.dy
    };
   };

   const l1 = asLine(R[0]);
   const v = R[1];
   const l2 = asLine(R[2]);

   if (!l1 || !v || v.t !== 'p' || !l2) return null;

   // Confirm that the vertex lies on both lines.
   const eps = 12;
   const d1 = Math.abs(
    (v.x - l1.x) * l1.dy -
    (v.y - l1.y) * l1.dx
   );
   const d2 = Math.abs(
    (v.x - l2.x) * l2.dy -
    (v.y - l2.y) * l2.dx
   );

   if (d1 > eps || d2 > eps) return null;

   let ax = l1.dx;
   let ay = l1.dy;
   let bx = l2.dx;
   let by = l2.dy;

   // Align directions to construct the internal angle bisector.
   if (ax * bx + ay * by < 0) {
    bx = -bx;
    by = -by;
   }

   const dx = ax + bx;
   const dy = ay + by;
   const len = Math.hypot(dx, dy);

   // Avoid an undefined bisector for parallel directions.
   if (len < 1e-6) return null;

   return {
    t: 'l',
    x: v.x,
    y: v.y,
    dx: dx / len,
    dy: dy / len
   };
  }
  case 'circ':return {t:'c',x:R[0].x,y:R[0].y,r:Math.hypot(R[1].x-R[0].x,R[1].y-R[0].y)};
  case 'int':{const c=inter(R[0],R[1]);return c[o.n]?{t:'p',...c[o.n]}:null}
 }
 return null;
}
function geo(id){if(GC.has(id))return GC.get(id);const o=M.get(id);let g=null;if(o){GC.set(id,null);const R=o.refs.map(geo);if(R.every(Boolean))g=calc(o,R)}GC.set(id,g);return g}
function inter(a,b){
 if(!a||!b)return [];
 if(a.t==='c'&&b.t!=='c')[a,b]=[b,a];
 if(a.t==='c'&&b.t==='c'){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d<1e-9||d>a.r+b.r||d<Math.abs(a.r-b.r))return [];
  const l=(a.r*a.r-b.r*b.r+d*d)/(2*d),h=Math.sqrt(Math.max(0,a.r*a.r-l*l)),ux=dx/d,uy=dy/d,mx=a.x+ux*l,my=a.y+uy*l;
  return [{x:mx-uy*h,y:my+ux*h},{x:mx+uy*h,y:my-ux*h}];
 }
 if(b.t==='c'){
  const fx=a.x-b.x,fy=a.y-b.y,B=fx*a.dx+fy*a.dy,C=fx*fx+fy*fy-b.r*b.r,disc=B*B-C;
  if(disc<0)return [];const s=Math.sqrt(disc);
  return [-B-s,-B+s].map(t=>({x:a.x+a.dx*t,y:a.y+a.dy*t}));
 }
 const cr=a.dx*b.dy-a.dy*b.dx;if(Math.abs(cr)<1e-9)return [];
 const t=((b.x-a.x)*b.dy-(b.y-a.y)*b.dx)/cr;
 return [{x:a.x+a.dx*t,y:a.y+a.dy*t}];
}
function onSeg(g,p){if(g.t!=='s')return true;const L=Math.hypot(g.x2-g.x1,g.y2-g.y1),t=(p.x-g.x1)*g.dx+(p.y-g.y1)*g.dy;return t>=-1&&t<=L+1}
function dist(g,w){
 if(!g)return Infinity;
 if(g.t==='p')return Math.hypot(w.x-g.x,w.y-g.y);
 if(g.t==='c')return Math.abs(Math.hypot(w.x-g.x,w.y-g.y)-g.r);
 if(g.t==='l')return Math.abs((w.x-g.x)*g.dy-(w.y-g.y)*g.dx);
 const L=Math.hypot(g.x2-g.x1,g.y2-g.y1),t=Math.max(0,Math.min(L,(w.x-g.x1)*g.dx+(w.y-g.y1)*g.dy));
 return Math.hypot(w.x-(g.x1+g.dx*t),w.y-(g.y1+g.dy*t));
}
const K=()=>cv.getBoundingClientRect().width/W;
function hitPoint(w){const tol=13/K();let best=null,bd=tol;for(const o of S.objs){if(!o.vis||!isPt(o))continue;const g=geo(o.id);if(!g)continue;const d=dist(g,w);if(d<bd){bd=d;best=o}}return best}
function hitLine(w,withCircle=false){const tol=9/K();let best=null,bd=tol;for(const o of S.objs){if(!o.vis||isPt(o)||(o.k==='circ'&&!withCircle))continue;const g=geo(o.id);if(!g)continue;const d=dist(g,w);if(d<bd){bd=d;best=o}}return best}
function dependents(ids){const del=new Set(ids);let ch=true;while(ch){ch=false;for(const o of S.objs)if(!del.has(o.id)&&o.refs.some(r=>del.has(r))){del.add(o.id);ch=true}}return del}
function removeObjs(ids){const del=dependents(ids);S.objs=S.objs.filter(o=>!del.has(o.id));pend=pend.filter(p=>!del.has(p.id));if(hover!=null&&del.has(hover))hover=null}
function clipT(g,pad){let t0=-1e5,t1=1e5;for(const [p,d,lo,hi] of [[g.x,g.dx,pad,W-pad],[g.y,g.dy,pad,H-pad]]){if(Math.abs(d)<1e-9){if(p<lo||p>hi)return null}else{let a=(lo-p)/d,b=(hi-p)/d;if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b)}}return t0<t1?[t0,t1]:null}
function paperPattern(B){const p=S.paper;if(p==='dot'){for(let x=GRID;x<W;x+=GRID)for(let y=GRID;y<H;y+=GRID)B.disc(x,y,1.9,'#D9C8C8')}else if(p==='line'){for(let y=GRID*2;y<H-10;y+=GRID)B.stroke([[0,y],[W,y]],'#D8C9D5',1.2);B.stroke([[GRID*3,0],[GRID*3,H]],'#E8B4B4',1.4)}else if(p==='box'){for(let x=GRID,i=1;x<W;x+=GRID,i++)B.stroke([[x,0],[x,H]],i%5?'#E8D9D7':'#D4BFC2',i%5?1:1.4);for(let y=GRID,i=1;y<H;y+=GRID,i++)B.stroke([[0,y],[W,y]],i%5?'#E8D9D7':'#D4BFC2',i%5?1:1.4)}}
function shape(B,g,c,w,a=1){if(g.t==='c')B.circle(g.x,g.y,g.r,c,w,a);else if(g.t==='s')B.stroke([[g.x1,g.y1],[g.x2,g.y2]],c,w,a);else if(g.t==='l'){const r=clipT(g,-2000);if(r)B.stroke([[g.x+g.dx*r[0],g.y+g.dy*r[0]],[g.x+g.dx*r[1],g.y+g.dy*r[1]]],c,w,a)}}
function labelPos(g){if(g.t==='p')return [g.x+10,g.y-10];if(g.t==='c')return [g.x+g.r*.7071+8,g.y-g.r*.7071-8];let nx=-g.dy,ny=g.dx;if(ny>0||(ny===0&&nx>0)){nx=-nx;ny=-ny}if(g.t==='s')return [(g.x1+g.x2)/2+nx*14,(g.y1+g.y2)/2+ny*14];const r=clipT(g,40);if(!r)return null;const t=r[1]-60;return [g.x+g.dx*t+nx*14,g.y+g.dy*t+ny*14]}
function render(B,ui){GC.clear();M=new Map(S.objs.map(o=>[o.id,o]));B.begin&&B.begin();paperPattern(B);for(const s of S.strokes)B.stroke(s.pts,INK[s.c]||INK.black,s.w||3.2);const vis=S.objs.filter(o=>o.vis);if(ui&&hover!=null){const h=M.get(hover),g=h&&h.vis&&geo(hover);if(g){if(g.t==='p')B.disc(g.x,g.y,15,'#611224',.22);else shape(B,g,'#611224',9,.22)}}for(const o of vis){if(isPt(o))continue;const g=geo(o.id);if(g)shape(B,g,INK[o.c]||INK.black,2.3)}for(const o of vis){if(!isPt(o))continue;const g=geo(o.id);if(g){B.disc(g.x,g.y,8,PAPER);B.disc(g.x,g.y,4.8,INK[o.c]||INK.black)}}if(DOC.labels)for(const o of vis){if(!o.name)continue;const g=geo(o.id);if(!g)continue;const p=labelPos(g);if(p)B.text(o.name,p[0],p[1],INK[o.c]||INK.black,23)}if(ui)overlay(B)}
function overlay(B){for(const p of pend){const g=geo(p.id);if(!g)continue;if(g.t==='p')B.circle(g.x,g.y,12,'#611224',2.4);else shape(B,g,'#611224',7,.35)}const last=pend.length&&geo(pend[pend.length-1].id);if(last&&last.t==='p'&&cur){if(tool==='circle')B.circle(last.x,last.y,Math.hypot(cur.x-last.x,cur.y-last.y),'#611224',1.8,.7);else if(['line','seg','mid','pbis','abis'].includes(tool))B.stroke([[last.x,last.y],[cur.x,cur.y]],'#611224',1.8,.7)}if(tool==='erase'&&cur)B.circle(cur.x,cur.y,16,'#611224',1.6,.9)}
const CB={
 stroke(p,c,w,a=1){ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(p.length===1)ctx.lineTo(p[0][0]+.01,p[0][1]);ctx.stroke();ctx.globalAlpha=1},
 circle(x,y,r,c,w,a=1){ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,Math.max(r,.01),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1},
 disc(x,y,r,c,a=1){ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1},
 text(s,x,y,c,sz){ctx.font='italic '+sz+'px Georgia,"Times New Roman",serif';ctx.fillStyle=c;ctx.fillText(s,x,y)},

const KEY='geo-sketchpad-v1';let hist=[],hi=0,dirty=false,drag=null;

function save(){const j=JSON.stringify(DOC);if(j===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(j);hi++;if(hist.length>150){hist.shift();hi--}persist(j)}
function loadSaved(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&Array.isArray(s.pages)&&s.pages.length){DOC=s;DOC.cur=Math.min(DOC.cur|0,s.pages.length-1)}else if(s&&Array.isArray(s.objs)&&Array.isArray(s.strokes)){DOC.pages=[Object.assign(newPage(),s)];DOC.labels=s.labels!==false;DOC.cur=0}S=DOC.pages[DOC.cur]}}catch(e){}}
function restore(){DOC=JSON.parse(hist[hi]);S=DOC.pages[DOC.cur];pend=[];hover=null;persist(hist[hi]);refreshAll()}
function undo(){if(hi>0){hi--;restore()}}function redo(){if(hi<hist.length-1){hi++;restore()}}
const changed=()=>{dirty=true};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pickPt(w){const h=hitPoint(w);if(h)return h;const o=add('free',[],{x:clamp(w.x,0,W),y:clamp(w.y,0,H)});changed();return o}
function needPts(n,make){return w=>{const o=pickPt(w);if(pend.some(p=>p.id===o.id))return;pend.push({id:o.id});if(pend.length===n){const ids=pend.map(p=>p.id);pend=[];make(ids);changed()}}}

const ic=p=>'<svg viewBox="0 0 24 24">'+p+'</svg>';
const D=(x,y)=>`<circle class="f" cx="${x}" cy="${y}" r="2.1"/>`;

TOOLS.inter={label:'Intersection',icon:ic('<path d="M4 5l16 14M4 19L20 5"/>'+D(12,12).replace('2.1','2.6')),hint:()=>pend.length?'Click the second object, near where they cross.':'Click the first line, segment or circle.',down(w){const h=hitLine(w,true);if(!h)return;if(!pend.length){pend=[{id:h.id}];return}if(pend[0].id===h.id)return;const a=pend[0].id,ga=geo(a),gb=geo(h.id);pend=[];let best=-1,bd=1e9;inter(ga,gb).forEach((p,i)=>{if(!onSeg(ga,p)||!onSeg(gb,p))return;const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=i}});if(best<0){toast('These two do not cross.');return}add('int',[a,h.id],{n:best});changed()}};
function buildTools(){const box=$('#tools');for(const id of ['pen','move','point','mid','line','seg','perp','para','pbis','abis','circle','inter','erase']){const t=TOOLS[id],b=document.createElement('button');b.className='tool';b.dataset.t=id;b.setAttribute('aria-pressed','false');b.innerHTML=t.icon+'<span>'+t.label+'</span>';box.append(b)}}
function setTool(t){tool=t;pend=[];hover=null;syncUI();draw()}
function syncUI(){document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===tool)));document.querySelectorAll('#inks .sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ink&&tool!=='erase')));document.querySelectorAll('#paper button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.paper)));$('#lbl').checked=DOC.labels;renderPages();$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1;cv.style.cursor=tool==='erase'?'cell':tool==='move'?'grab':'crosshair';$('#hint').innerHTML='<b>'+TOOLS[tool].label+'.</b> '+TOOLS[tool].hint()}
function renderList(){const ul=$('#list');if(!S.objs.length){ul.innerHTML='<li class="empty" style="display:block">Points, lines, segments and circles you construct appear here. Rename, hide or delete them from this list.</li>';return}ul.innerHTML=S.objs.map(o=>`<li data-id="${o.id}" class="${o.vis?'':'off'}"><button class="ic eye" title="${o.vis?'Hide':'Show'}" aria-label="${o.vis?'Hide':'Show'} ${esc(o.name)}">${o.vis?EYE:EYE_OFF}</button><button class="ic cc" title="Change color" aria-label="Change color"><span class="dot" style="background:${INK[o.c]}"></span></button><input class="nm" value="${esc(o.name)}" aria-label="Name" maxlength="24" spellcheck="false"><span class="kind">${KIND[o.k]}</span><button class="ic del" title="Delete" aria-label="Delete ${esc(o.name)}">${TRASH}</button></li>`).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';

function refreshAll(){renderList();syncUI();draw()}
function afterAction(){if(dirty){save();dirty=false}renderList();syncUI();draw()}
loadSaved();hist=[JSON.stringify(DOC)];hi=0;buildTools();
function renderPages(){const el=$('#pages');el.innerHTML='<span class="plab">Pages</span>'+DOC.pages.map((p,i)=>`<button class="btn pg" data-p="${i}" aria-pressed="${i===DOC.cur}">${i+1}</button>`).join('')+'<button class="btn" id="addpg">+ Add page</button><button class="btn" id="delpg"'+(DOC.pages.length<2?' disabled':'')+'>Delete page</button>'}
function setPage(i){DOC.cur=i;S=DOC.pages[i];pend=[];hover=null;save();refreshAll()}
let delArm=0;
$('#pages').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p!==undefined)setPage(+b.dataset.p);else if(b.id==='addpg'){DOC.pages.push(newPage(S.paper));setPage(DOC.pages.length-1);toast('Page '+DOC.pages.length+' added.')}else if(b.id==='delpg'){if(!delArm){b.textContent='Click again to delete';delArm=setTimeout(()=>{delArm=0;renderPages()},3000);return}clearTimeout(delArm);delArm=0;DOC.pages.splice(DOC.cur,1);setPage(Math.min(DOC.cur,DOC.pages.length-1))}});
cv.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}cur=pos(e);drag=null;TOOLS[tool].down(cur);afterAction()});
cv.addEventListener('pointermove',e=>{cur=pos(e);if(drag){drag.move(cur);draw();return}if(tool!=='pen'){const h=hitPoint(cur)||hitLine(cur,true);hover=h?h.id:null}draw()});

cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);cv.addEventListener('pointerleave',()=>{if(!drag){cur=null;hover=null;draw()}});
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)setTool(b.dataset.t)});
$('#inks').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;ink=b.dataset.v;if(tool==='erase')tool='pen';pend=[];syncUI();draw()});
$('#paper').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.paper=b.dataset.v;save();syncUI();draw()});

let clearArm=0;$('#clear').addEventListener('click',e=>{const b=e.currentTarget;if(!clearArm){b.textContent='Click again to clear';clearArm=setTimeout(()=>{clearArm=0;b.textContent='Clear all'},3000);return}clearTimeout(clearArm);clearArm=0;b.textContent='Clear all';const keep=S.paper;Object.assign(S,newPage(keep));pend=[];hover=null;save();refreshAll()});
const L=$('#list');

$('#pdf').addEventListener('click',()=>{const keep=S;const oldCur=DOC.cur;const printWindow=window.open('','_blank');if(!printWindow){toast('Allow pop-ups to export/print the sketch.');return}let pagesHtml='';for(let i=0;i<DOC.pages.length;i++){S=DOC.pages[i];const off=document.createElement('canvas');off.width=W;off.height=H;const oc=off.getContext('2d');const oldCtx=ctx;/* render through the shared backend below */const backend={begin(){oc.fillStyle=PAPER;oc.fillRect(0,0,W,H)},stroke(p,c,w,a=1){oc.globalAlpha=a;oc.strokeStyle=c;oc.lineWidth=w;oc.lineCap='round';oc.lineJoin='round';oc.beginPath();p.forEach((q,j)=>j?oc.lineTo(q[0],q[1]):oc.moveTo(q[0],q[1]));oc.stroke();oc.globalAlpha=1},circle(x,y,r,c,w,a=1){oc.globalAlpha=a;oc.strokeStyle=c;oc.lineWidth=w;oc.beginPath();oc.arc(x,y,Math.max(.01,r),0,Math.PI*2);oc.stroke();oc.globalAlpha=1},disc(x,y,r,c,a=1){oc.globalAlpha=a;oc.fillStyle=c;oc.beginPath();oc.arc(x,y,r,0,Math.PI*2);oc.fill();oc.globalAlpha=1},text(s,x,y,c,sz){oc.fillStyle=c;oc.font='italic '+sz+'px Georgia,serif';oc.fillText(s,x,y)}};render(backend,false);pagesHtml+=`<section><img src="${off.toDataURL('image/png')}"></section>`}S=keep;DOC.cur=oldCur;draw();printWindow.document.write('<!doctype html><html><head><title>Geometry Sketchpad PDF</title><style>@page{size:A4 landscape;margin:8mm}body{margin:0}section{page-break-after:always}section:last-child{page-break-after:auto}img{display:block;width:100%;height:auto}</style></head><body>'+pagesHtml+'<script>window.onload=()=>{window.print()}<\/script></body></html>');printWindow.document.close();toast('Print dialog opened. Choose Save as PDF.')});
